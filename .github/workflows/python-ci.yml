name: Python CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[ci]'
      - run: python -m compileall -q src tests tools
      - run: python -m pytest -q
