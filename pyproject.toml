[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m750"
version = "0.2.0"
description = "Feature-first myArm M750 control: real robot, MuJoCo, sim2real and perception"
requires-python = ">=3.10"
# Dependencies KHONG liet ke o day: moi truong robot (Jetson) quan ly rieng
# va pip install -e . phai chay duoc OFFLINE. Danh sach runtime:
# pymycobot, pinocchio (pin), scipy, numpy, opencv-python, mujoco - xem README.
dependencies = []

[project.scripts]
m750-state = "m750.cli:state_main"
m750-camera = "m750.cli:camera_main"
m750-preview = "m750.cli:preview_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"m750.model" = ["*.urdf", "*.xml", "*.yaml", "meshes/mujoco/*.obj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# This script is run manually against the physical robot.
addopts = ["--ignore=tests/test_gripper_pose_hardware.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E731", "E702", "E501", "W293"]
